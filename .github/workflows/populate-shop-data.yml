          ["SA016","SAL-1016","C008","Harish","P002","Apcolite Premium 20L",1,8450,0,8450,5000,3450,"Credit","2026-09-03"]
          ]

          purchases = [
          ["PU001","PUR-2001","S001","Asian Paints Authorized Distributor","P001","Tractor Emulsion 20L",10,6200,62000,62000,0,"Bank Transfer","2026-09-18"],
          ["PU002","PUR-2002","S002","Berger Paints Regional Distributor","P003","WeatherCoat Long Life 20L",8,7200,57600,50000,7600,"Bank Transfer","2026-09-16"],
          ["PU003","PUR-2003","S003","JSW Paints Distributor","P005","Halo Advanced Primer 20L",15,3100,46500,46500,0,"UPI","2026-09-14"],
          ["PU004","PUR-2004","S004","Building Materials Wholesale","P010","ACC Gold Water Shield 50kg",40,340,13600,10000,3600,"Cash","2026-09-12"],
          ["PU005","PUR-2005","S004","Building Materials Wholesale","P011","UltraTech PPC Cement 50kg",30,350,10500,10500,0,"Bank Transfer","2026-09-10"],
          ["PU006","PUR-2006","S002","Berger Paints Regional Distributor","P004","Easy Clean 20L",10,6750,67500,60000,7500,"Bank Transfer","2026-09-08"],
          ["PU007","PUR-2007","S001","Asian Paints Authorized Distributor","P017","Royale Matt 4L",8,1900,15200,15200,0,"UPI","2026-09-06"],
          ["PU008","PUR-2008","S005","Pidilite Trade Distributor","P015","Fevicol SH 1kg",20,145,2900,2900,0,"Cash","2026-09-04"],
          ["PU009","PUR-2009","S005","Pidilite Trade Distributor","P016","Dr. Fixit Pidicrete 1L",12,175,2100,2000,100,"Cash","2026-09-02"],
          ["PU010","PUR-2010","S004","Building Materials Wholesale","P012","JK Wall Putty 40kg",10,1120,11200,11200,0,"Bank Transfer","2026-08-31"]
          ]

          wb=Workbook()
          wb.remove(wb.active)
          for name in headers:
              ws=wb.create_sheet(name)
              ws.append(headers[name])
              rows={"Products":products,"Customers":customers,"Suppliers":suppliers,"Sales":sales,"Purchases":purchases}.get(name,[])
              for row in rows: ws.append(row)

          ws=wb["Stock Movements"]
          for r in sales:
              ws.append([f"MV-{r[0]}",r[4],r[5],"SALE",-r[6],r[1],r[13]])
          for r in purchases:
              ws.append([f"MV-{r[0]}",r[4],r[5],"PURCHASE",r[6],r[1],r[12]])

          for ws in wb.worksheets:
              ws.freeze_panes="A2"
              for cell in ws[1]:
                  cell.font=Font(bold=True)
                  cell.fill=PatternFill("solid",fgColor="D9EAF7")
                  cell.alignment=Alignment(horizontal="center")
              for c in range(1,ws.max_column+1):
                  width=max(12,max(len(str(ws.cell(r,c).value or "")) for r in range(1,min(ws.max_row,50)+1))+2)
                  ws.column_dimensions[get_column_letter(c)].width=min(width,30)

          wb.save("Raghava_Shop_Data.xlsx")
          PY

      - name: Commit populated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raghava_Shop_Data.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Populate paint shop sample data"
          git push
